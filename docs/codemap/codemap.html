  <script>
  (()=>{
    const data=JSON.parse(document.getElementById('codemap-data').textContent);
    const ns='http://www.w3.org/2000/svg', colors={presentation:'#60a5fa',domain:'#a78bfa',service:'#34d399',data:'#fbbf24',database:'#fb923c',queue:'#f472b6',native:'#22d3ee',integration:'#2dd4bf',external:'#f87171'};
    const byId=new Map(data.nodes.map(n=>[n.id,n])), outgoing=new Map(), incoming=new Map();
    data.nodes.forEach(n=>{outgoing.set(n.id,[]);incoming.set(n.id,[])});data.edges.forEach((e,i)=>{e._i=i;outgoing.get(e.from).push(e);incoming.get(e.to).push(e)});
    generated.textContent=new Date(data.generated_at).toLocaleString();commit.textContent=data.generated_from_commit.slice(0,12);counts.textContent=`${data.nodes.length} modules · ${data.edges.length} evidenced relationships`;
    const types=[...new Set(data.nodes.map(n=>n.type))];const enabled=new Set(types);let selected=null,selectedFlow=null,searchTerm='';
    types.forEach(t=>{const label=document.createElement('label');label.innerHTML=`<input type="checkbox" checked data-type="${t}"><span class="dot" style="background:${colors[t]}"></span>${t}`;legend.append(label)});
    legend.addEventListener('change',e=>{const t=e.target.dataset.type;e.target.checked?enabled.add(t):enabled.delete(t);renderState()});
    data.flows.forEach(f=>{const b=document.createElement('button');b.className='flow-button';b.dataset.flow=f.id;b.innerHTML=`${f.name}<small>${f.trigger}</small>`;b.onclick=()=>{selected=null;selectedFlow=selectedFlow===f.id?null:f.id;renderState();showFlow(f)};flows.append(b)});
    const layer={presentation:0,domain:1,service:2,queue:2,data:3,database:3,native:4,integration:4,external:5};const columns=new Map();data.nodes.forEach(n=>(columns.get(layer[n.type])||columns.set(layer[n.type],[]).get(layer[n.type])).push(n));
    const score=(n,neighborMap,positions)=>{const es=neighborMap.get(n.id);if(!es.length)return 1e6;const ids=es.map(e=>e.from===n.id?e.to:e.from).filter(id=>positions.has(id));return ids.length?ids.reduce((s,id)=>s+positions.get(id),0)/ids.length:1e6};
    for(let sweep=0;sweep<5;sweep++){const pos=new Map();[...columns.keys()].sort((a,b)=>a-b).forEach(k=>columns.get(k).forEach((n,i)=>pos.set(n.id,i)));[...columns.keys()].sort((a,b)=>a-b).forEach(k=>columns.get(k).sort((a,b)=>score(a,incoming,pos)-score(b,incoming,pos)));[...columns.keys()].sort((a,b)=>b-a).forEach(k=>columns.get(k).sort((a,b)=>score(a,outgoing,pos)-score(b,outgoing,pos)))}
    const nodeW=238,nodeH=94,gapX=65;const positions=new Map();columns.forEach((arr,k)=>{const gap=Math.min(122,850/Math.max(1,arr.length));const start=110+(850-gap*(arr.length-1))/2;arr.forEach((n,i)=>positions.set(n.id,{x:42+k*(nodeW+gapX),y:start+i*gap}))});
    const boundaryNames=['Presentation','Domain','Services & queues','Data stores','Native & integrations','External system'];const boundaries=document.getElementById('boundaries');for(let k=0;k<6;k++){const r=document.createElementNS(ns,'rect');r.setAttribute('class','boundary');r.setAttribute('x',22+k*(nodeW+gapX));r.setAttribute('y',45);r.setAttribute('width',nodeW+40);r.setAttribute('height',930);r.setAttribute('rx',16);boundaries.append(r);const t=document.createElementNS(ns,'text');t.setAttribute('class','boundary-label');t.setAttribute('x',42+k*(nodeW+gapX));t.setAttribute('y',76);t.textContent=boundaryNames[k];boundaries.append(t)}
    const edgeEls=new Map(),nodeEls=new Map();const edgeGroup=document.getElementById('edges'),nodeGroup=document.getElementById('nodes');
    const edgePath=e=>{const a=positions.get(e.from),b=positions.get(e.to);const x1=a.x+nodeW,y1=a.y+nodeH/2,x2=b.x,y2=b.y+nodeH/2;const bend=Math.max(35,Math.abs(x2-x1)*.44);return `M${x1},${y1} C${x1+bend},${y1} ${x2-bend},${y2} ${x2},${y2}`};
    data.edges.forEach(e=>{const p=document.createElementNS(ns,'path');p.setAttribute('class','edge');p.dataset.i=e._i;p.setAttribute('d',edgePath(e));const title=document.createElementNS(ns,'title');title.textContent=`${e.from} → ${e.to} · ${e.type}\n${e.evidence.map(x=>x.path+' :: '+x.symbol).join('\n')}`;p.append(title);edgeGroup.append(p);edgeEls.set(e._i,p)});
    const wrap=(text,max=34)=>{const words=text.split(/\s+/),lines=[''];for(const w of words){const i=lines.length-1;if((lines[i]+' '+w).trim().length>max&&lines[i])lines.push(w);else lines[i]=(lines[i]+' '+w).trim()}return lines.slice(0,2)};
    data.nodes.forEach(n=>{const g=document.createElementNS(ns,'g'),p=positions.get(n.id);g.setAttribute('class','node');g.dataset.id=n.id;g.setAttribute('transform',`translate(${p.x} ${p.y})`);const r=document.createElementNS(ns,'rect');r.setAttribute('width',nodeW);r.setAttribute('height',nodeH);r.setAttribute('rx',12);r.setAttribute('stroke',colors[n.type]);g.append(r);const badge=document.createElementNS(ns,'text');badge.setAttribute('class','badge');badge.setAttribute('x',14);badge.setAttribute('y',19);badge.setAttribute('fill',colors[n.type]);badge.textContent=n.type;g.append(badge);const title=document.createElementNS(ns,'text');title.setAttribute('class','title');title.setAttribute('x',14);title.setAttribute('y',42);title.textContent=n.id;g.append(title);wrap(n.role).forEach((line,i)=>{const t=document.createElementNS(ns,'text');t.setAttribute('class','role');t.setAttribute('x',14);t.setAttribute('y',62+i*15);t.textContent=line;g.append(t)});g.onclick=e=>{e.stopPropagation();selected=selected===n.id?null:n.id;selectedFlow=null;renderState();selected?showNode(n):showDefault()};enableDrag(g,n.id);nodeGroup.append(g);nodeEls.set(n.id,g)});
    function descendants(id,map){const seen=new Set(),stack=[id];while(stack.length){const cur=stack.pop();for(const e of map.get(cur)||[]){const next=e.from===cur?e.to:e.from;if(!seen.has(next)){seen.add(next);stack.push(next)}}}seen.delete(id);return seen}
    function renderState(){const visible=new Set(data.nodes.filter(n=>enabled.has(n.type)).map(n=>n.id));const up=selected?descendants(selected,incoming):new Set(),down=selected?descendants(selected,outgoing):new Set(),flow=selectedFlow?data.flows.find(f=>f.id===selectedFlow):null,flowIds=new Set(flow?.steps||[]);const hasFocus=!!selected||!!flow||!!searchTerm;nodeEls.forEach((el,id)=>{const n=byId.get(id),hay=(id+' '+n.path+' '+n.role+' '+n.entrypoints.join(' ')).toLowerCase(),match=searchTerm&&hay.includes(searchTerm);el.style.display=visible.has(id)?'':'none';el.classList.toggle('active',id===selected||up.has(id)||down.has(id));el.classList.toggle('flow',flowIds.has(id));el.classList.toggle('match',!!match);el.classList.toggle('dim',hasFocus&&!match&&!flowIds.has(id)&&id!==selected&&!up.has(id)&&!down.has(id))});edgeEls.forEach((el,i)=>{const e=data.edges[i],show=visible.has(e.from)&&visible.has(e.to),active=selected&&(e.from===selected||e.to===selected||((up.has(e.from)||e.from===selected)&&(up.has(e.to)||e.to===selected))||((down.has(e.from)||e.from===selected)&&(down.has(e.to)||e.to===selected))),inFlow=flowIds.has(e.from)&&flowIds.has(e.to);el.style.display=show?'':'none';el.classList.toggle('active',!!active);el.classList.toggle('flow',!!inFlow);el.classList.toggle('dim',hasFocus&&!active&&!inFlow)});document.querySelectorAll('.flow-button').forEach(b=>b.classList.toggle('active',b.dataset.flow===selectedFlow))}
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function showNode(n){const ins=incoming.get(n.id),outs=outgoing.get(n.id),members=data.flows.filter(f=>f.steps.includes(n.id));details.className='';details.innerHTML=`<h2>${esc(n.id)}</h2><p class="path">${esc(n.path)}</p><p>${esc(n.role)}</p><h3>Entrypoints</h3>${n.entrypoints.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}<h3>Upstream callers</h3>${ins.length?ins.map(e=>`<p>${esc(e.from)} <span class="pill">${e.type}</span></p>`).join(''):'<p class="empty">None mapped</p>'}<h3>Downstream dependencies</h3>${outs.length?outs.map(e=>`<p>${esc(e.to)} <span class="pill">${e.type}</span></p>`).join(''):'<p class="empty">None mapped</p>'}<h3>Related tests</h3>${n.tests.length?n.tests.map(x=>`<p class="path">${esc(x)}</p>`).join(''):'<p class="empty">No directly related tests found</p>'}<h3>Flows</h3>${members.length?members.map(x=>`<span class="pill">${esc(x.name)}</span>`).join(''):'<p class="empty">None</p>'}<h3>Constraints</h3>${n.constraints.map(x=>`<p>• ${esc(x)}</p>`).join('')}<h3>Evidence</h3>${n.evidence.map(x=>`<p class="path">${esc(x.path)} :: ${esc(x.symbol)}</p>`).join('')}`}
    function showFlow(f){details.className='';details.innerHTML=`<h2>${esc(f.name)}</h2><h3>Trigger</h3><p>${esc(f.trigger)}</p><h3>Path</h3>${f.steps.map((id,i)=>`<p><span class="pill">${i+1}</span>${esc(id)}</p>`).join('')}<h3>Outcome</h3><p>${esc(f.outcome)}</p>`}function showDefault(){details.className='empty';details.textContent='Select a module to see callers, dependencies, tests, flow membership, constraints, and source evidence.'}
    search.oninput=()=>{searchTerm=search.value.trim().toLowerCase();renderState()};clear.onclick=()=>{selected=null;selectedFlow=null;search.value='';searchTerm='';showDefault();renderState()};
    let scale=1,tx=0,ty=0;const camera=document.getElementById('camera'),viewport=document.getElementById('viewport');function transform(){camera.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`)}function zoom(f,cx=950,cy=520){const next=Math.max(.35,Math.min(2.8,scale*f));tx=cx-(cx-tx)*(next/scale);ty=cy-(cy-ty)*(next/scale);scale=next;transform()}zoomIn.onclick=()=>zoom(1.2);zoomOut.onclick=()=>zoom(.82);fit.onclick=()=>{scale=1;tx=0;ty=0;transform()};viewport.onwheel=e=>{e.preventDefault();const pt=document.getElementById('graph').createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const loc=pt.matrixTransform(camera.getScreenCTM().inverse());zoom(e.deltaY<0?1.12:.89,loc.x*scale+tx,loc.y*scale+ty)};
    let pan=null;viewport.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;pan={x:e.clientX,y:e.clientY,tx,ty};viewport.classList.add('panning');viewport.setPointerCapture(e.pointerId)});viewport.addEventListener('pointermove',e=>{if(!pan)return;tx=pan.tx+(e.clientX-pan.x);ty=pan.ty+(e.clientY-pan.y);transform()});viewport.addEventListener('pointerup',()=>{pan=null;viewport.classList.remove('panning')});
    function enableDrag(g,id){let drag=null;g.addEventListener('pointerdown',e=>{e.stopPropagation();const p=positions.get(id);drag={x:e.clientX,y:e.clientY,ox:p.x,oy:p.y};g.setPointerCapture(e.pointerId)});g.addEventListener('pointermove',e=>{if(!drag)return;const p=positions.get(id);p.x=drag.ox+(e.clientX-drag.x)/scale;p.y=drag.oy+(e.clientY-drag.y)/scale;g.setAttribute('transform',`translate(${p.x} ${p.y})`);data.edges.filter(x=>x.from===id||x.to===id).forEach(x=>edgeEls.get(x._i).setAttribute('d',edgePath(x)))});g.addEventListener('pointerup',()=>drag=null)}
    document.getElementById('graph').onclick=()=>{selected=null;selectedFlow=null;showDefault();renderState()};renderState();transform();
  })();
